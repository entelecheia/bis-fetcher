[project]
name = "bis-fetcher"
version = "1.0.1"
description = "A python library to scrape the BIS website"
authors = [{ name = "Young Joon Lee", email = "entelecheia@hotmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pandas>=2.1",
    "pdf2image>=1.16",
    "pydantic>=2.7",
    "PyPDF2>=3.0",
    "pytesseract>=0.3.10",
    "requests>=2.31",
    "selenium>=4.15.2",
]

[project.urls]
Homepage = "https://entelecheia.github.io/bis-fetcher"
Repository = "https://github.com/entelecheia/bis-fetcher"
Changelog = "https://github.com/entelecheia/bis-fetcher/blob/main/CHANGELOG.md"

[project.scripts]
bis_fetcher = "bis_fetcher.__cli__:main"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.15"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bis_fetcher"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S603", "S607", "RUF001"]
# pydantic fields: mutable defaults are copied per instance
"src/bis_fetcher/fetcher/bis.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["bis_fetcher"]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", 'if __name__ == "__main__":']

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
major_on_zero = true
version_source = "tag"
commit_message = ":rocket: {version}\n\nAutomatically generated by python-semantic-release"
build_command = "pip install uv==0.13.1 && uv lock --upgrade-package \"$PACKAGE_NAME\" && git add uv.lock && uv build"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/bis_fetcher/_version.py:__version__"]

[tool.semantic_release.branches.main]
match = "release"
prerelease = false

[tool.semantic_release.changelog]
insertion_flag = "<!--next-version-placeholder-->"
mode = "update"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
